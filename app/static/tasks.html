<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Tasks &mdash; EmailAssist</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <rect x="2" y="4.5" width="20" height="14" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
            <path d="M3 6.2l9 6.3 9-6.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="18.5" cy="16.5" r="4.6" fill="var(--side-bg)"/>
            <path d="M16.6 16.6l1.3 1.3 2.3-2.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div>
          <p class="brand-name">EmailAssist</p>
          <p class="brand-tag">Local email triage</p>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Primary">
        <a href="/" class="sidebar-nav-link">Workspace</a>
        <a href="/tasks" class="sidebar-nav-link is-active">Tasks</a>
        <a href="/about" class="sidebar-nav-link">About</a>
      </nav>

      <a href="/" class="button button--primary sidebar-new">+ New analysis</a>

      <div id="health" class="health" role="status" aria-live="polite">
        <span class="dot dot--unknown"></span><span class="health-text">checking the local model&hellip;</span>
      </div>

      <div class="history" aria-labelledby="history-heading">
        <div class="history-head">
          <h2 id="history-heading">History</h2>
          <button type="button" id="purge-button" class="text-button">Clear all</button>
        </div>
        <ul id="history-list" class="history-list"></ul>
      </div>

      <p class="sidebar-footer">Runs locally. Nothing is uploaded anywhere.</p>
    </aside>

    <main class="workspace">
      <section aria-labelledby="tasks-heading">
        <h1 id="tasks-heading" class="page-title">Tasks</h1>
        <p class="view-tagline">
          Every action item the pipeline found, from every thread you have
          analysed, in one list.
        </p>

        <div class="tasks-toolbar">
          <div class="segmented" role="group" aria-label="Whose tasks to show">
            <button type="button" class="segment is-active" data-owner="me">Yours</button>
            <button type="button" class="segment" data-owner="them">Theirs</button>
            <button type="button" class="segment" data-owner="all">All</button>
          </div>
          <label class="toggle">
            <input type="checkbox" id="show-done"> Show completed
          </label>
        </div>

        <p id="tasks-summary" class="tasks-summary" aria-live="polite"></p>
        <div id="tasks-groups"></div>
      </section>
    </main>
  </div>

  <script src="/static/render.js"></script>
  <script src="/static/sidebar.js"></script>
  <script src="/static/tasks.js"></script>
</body>
</html>
