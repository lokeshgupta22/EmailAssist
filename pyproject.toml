[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-agent"
version = "0.1.0"
description = "Local-first, security-hardened email thread summarizer with a small language model in the loop."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: tests that need a running Ollama instance (deselect with -m 'not integration')",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/pipeline/_extract_worker.py"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
# Linting only - formatting is black's job, so ruff's formatter stays unused.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "PTH", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
